# 本文件由 ly_bag_recorder C++ 节点直接读取；launch 不解析或生成录包参数。
# 相对路径以此文件所在目录为基准，默认保存到仓库 bags/。
output_directory: ../bags

storage:
  storage_id: sqlite3
  max_cache_size: 104857600       # 与原 ros2 bag record 默认100MiB缓存一致。
  max_bagfile_size: 0            # 字节；0不按大小分包。
  max_bagfile_duration: 0        # 秒；0不按时间分包。
  storage_preset_profile: ''
  storage_config_uri: ''         # 可指定存储插件配置；相对本YAML所在目录。

record:
  all: true
  topics: []
  regex: ''
  exclude: ''
  include_hidden_topics: true
  include_unpublished_topics: false
  is_discovery_disabled: false   # 持续发现启动后新增话题。
  topic_polling_interval_ms: 100
  start_paused: false
  use_sim_time: false            # 沿用接收时间记录；消息内部header不改。

# 只改变录包订阅QoS，其余话题由原生Recorder自动适配。
qos:
  /livox/lidar:
    history: keep_last
    depth: 100
    reliability: best_effort
    durability: volatile
  /livox/imu:
    history: keep_last
    depth: 1000
    reliability: best_effort
    durability: volatile
  /ly_lio/odometry:
    history: keep_last
    depth: 1000
    reliability: reliable
    durability: volatile
  /ly_lio/cloud_registered:
    history: keep_last
    depth: 1000
    reliability: reliable
    durability: volatile
  /tf:
    history: keep_last
    depth: 1000
    reliability: reliable
    durability: volatile
  /tf_static:
    history: keep_last
    depth: 100
    reliability: reliable
    durability: transient_local  # 接收启动前已发布的静态安装TF。
